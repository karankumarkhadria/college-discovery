<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 42px Arial, Helvetica, sans-serif; fill: #1c2430; }
      .subtitle { font: 500 20px Arial, Helvetica, sans-serif; fill: #687385; }
      .table { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .head { fill: #0f6070; }
      .head2 { fill: #166534; }
      .head3 { fill: #c2410c; }
      .tableTitle { font: 800 23px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .field { font: 500 18px Arial, Helvetica, sans-serif; fill: #1c2430; }
      .fieldMuted { font: 500 16px Arial, Helvetica, sans-serif; fill: #687385; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line2 { stroke: #0f6070; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .labelBox { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.5; rx: 8; }
      .label { font: 800 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .note { fill: #ecfeff; stroke: #67e8f9; stroke-width: 2; rx: 14; }
      .noteText { font: 700 18px Arial, Helvetica, sans-serif; fill: #164e63; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f6070"/>
    </marker>
  </defs>

  <rect class="bg" width="1700" height="1050"/>
  <text class="title" x="70" y="70">College Discovery Database Schema</text>
  <text class="subtitle" x="70" y="106">Six database models used by the product: auth, college search, compare, predictor, reviews, and saved colleges.</text>

  <g transform="translate(80,175)">
    <rect class="table" width="360" height="250"/>
    <rect class="head" width="360" height="58" rx="14"/>
    <text class="tableTitle" x="24" y="38">User</text>
    <text class="field" x="24" y="92">id</text>
    <text class="field" x="24" y="124">name</text>
    <text class="field" x="24" y="156">email</text>
    <text class="field" x="24" y="188">passwordHash</text>
    <text class="fieldMuted" x="24" y="220">createdAt, updatedAt</text>
  </g>

  <g transform="translate(80,545)">
    <rect class="table" width="360" height="215"/>
    <rect class="head" width="360" height="58" rx="14"/>
    <text class="tableTitle" x="24" y="38">Session</text>
    <text class="field" x="24" y="92">id</text>
    <text class="field" x="24" y="124">tokenHash</text>
    <text class="field" x="24" y="156">userId</text>
    <text class="fieldMuted" x="24" y="188">expiresAt, createdAt</text>
  </g>

  <g transform="translate(670,135)">
    <rect class="table" width="410" height="345"/>
    <rect class="head2" width="410" height="58" rx="14"/>
    <text class="tableTitle" x="24" y="38">College</text>
    <text class="field" x="24" y="92">id, slug, name</text>
    <text class="field" x="24" y="124">city, state, type</text>
    <text class="field" x="24" y="156">feeMin, feeMax</text>
    <text class="field" x="24" y="188">rating, reviewCount</text>
    <text class="field" x="24" y="220">placementRate</text>
    <text class="field" x="24" y="252">averagePackage, highestPackage</text>
    <text class="field" x="24" y="284">examsAccepted, tags</text>
    <text class="fieldMuted" x="24" y="316">imageUrl, overview, recruiters</text>
  </g>

  <g transform="translate(1245,175)">
    <rect class="table" width="360" height="250"/>
    <rect class="head2" width="360" height="58" rx="14"/>
    <text class="tableTitle" x="24" y="38">Course</text>
    <text class="field" x="24" y="92">id</text>
    <text class="field" x="24" y="124">collegeId</text>
    <text class="field" x="24" y="156">name, degree, duration</text>
    <text class="field" x="24" y="188">annualFee, seats</text>
    <text class="fieldMuted" x="24" y="220">exam, closingRank</text>
  </g>

  <g transform="translate(670,615)">
    <rect class="table" width="410" height="230"/>
    <rect class="head3" width="410" height="58" rx="14"/>
    <text class="tableTitle" x="24" y="38">SavedCollege</text>
    <text class="field" x="24" y="92">id</text>
    <text class="field" x="24" y="124">userId</text>
    <text class="field" x="24" y="156">collegeId</text>
    <text class="field" x="24" y="188">createdAt</text>
    <text class="fieldMuted" x="24" y="218">one user + one college only once</text>
  </g>

  <g transform="translate(1245,615)">
    <rect class="table" width="360" height="230"/>
    <rect class="head3" width="360" height="58" rx="14"/>
    <text class="tableTitle" x="24" y="38">Review</text>
    <text class="field" x="24" y="92">id</text>
    <text class="field" x="24" y="124">collegeId</text>
    <text class="field" x="24" y="156">userId</text>
    <text class="field" x="24" y="188">rating, title, body</text>
    <text class="fieldMuted" x="24" y="218">author, createdAt</text>
  </g>

  <path class="line" d="M440 300 C500 300 575 300 670 300"/>
  <rect class="labelBox" x="505" y="270" width="120" height="34"/>
  <text class="label" x="522" y="293">writes reviews</text>

  <path class="line" d="M440 655 C520 655 575 705 670 725"/>
  <rect class="labelBox" x="495" y="660" width="135" height="34"/>
  <text class="label" x="512" y="683">saves colleges</text>

  <path class="line2" d="M260 425 L260 545"/>
  <rect class="labelBox" x="282" y="475" width="135" height="34"/>
  <text class="label" x="298" y="498">has sessions</text>

  <path class="line2" d="M1080 300 C1145 300 1180 300 1245 300"/>
  <rect class="labelBox" x="1115" y="270" width="115" height="34"/>
  <text class="label" x="1134" y="293">has courses</text>

  <path class="line" d="M875 480 L875 615"/>
  <rect class="labelBox" x="900" y="538" width="132" height="34"/>
  <text class="label" x="916" y="561">can be saved</text>

  <path class="line" d="M1080 730 C1140 730 1180 730 1245 730"/>
  <rect class="labelBox" x="1120" y="700" width="116" height="34"/>
  <text class="label" x="1140" y="723">has reviews</text>

  <g transform="translate(80,915)">
    <rect class="note" width="1525" height="72"/>
    <text class="noteText" x="24" y="44">Read the arrows like this: one user has sessions, one college has courses, users save colleges through SavedCollege, and users review colleges through Review.</text>
  </g>
</svg>
